name: Pull Request CI

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  fast-tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run checks
        run: ./gradlew check -x :appiumTests:test


  maestro-e2e:
    name: Maestro E2E tests
    needs: fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            adb logcat -c
            adb logcat -v time > "$GITHUB_WORKSPACE/android-logcat.txt" &
            LOGCAT_PID=$!

            set +e
            maestro --verbose test .maestro
            MAESTRO_EXIT=$?

            kill $LOGCAT_PID || true

            exit $MAESTRO_EXIT

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            ~/.maestro/tests
            android-logcat.txt
          if-no-files-found: error

  appium-e2e:
    name: Appium E2E tests
    needs: fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Appium
        run: |
          npm install -g appium@3.7.0
          appium driver install uiautomator2@8.6.4
          appium --version
          appium driver list --installed

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk

            appium > appium.log 2>&1 &
            APPIUM_PID=$!

            for i in {1..30}; do
              if curl --silent --fail http://127.0.0.1:4723/status > /dev/null; then
                break
              fi
              sleep 1
            done

            set +e
            ./gradlew :appiumTests:test
            TEST_EXIT=$?
            set -e

            kill $APPIUM_PID || true

            exit $TEST_EXIT

      - name: Upload Appium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-results
          path: |
            appium.log
            appiumTests/build/reports/tests/test