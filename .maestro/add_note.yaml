appId: com.pguillen.readingtracker
---
- launchApp:
    clearState: true
- openLink:
    link:  readingtracker://debug/seed/single-book
- extendedWaitUntil:
    visible:
      id: "library_book_card"
    timeout: 30000
- tapOn:
    id: "library_book_card"
    index: 0
- tapOn:
    id: "book_detail_add_note_button"
- tapOn:
    id: "add_edit_note_content_field"
- inputText: "New note"
- hideKeyboard
- tapOn:
    id: "add_edit_note_page_field"
- inputText: "22"
- hideKeyboard
- tapOn:
    id: "add_edit_note_save_button"
- assertVisible:
    id: "book_detail_note_row"
    containsDescendants: 
        - text: "Note"
        - text: "New note"
        - text: "Page 22"