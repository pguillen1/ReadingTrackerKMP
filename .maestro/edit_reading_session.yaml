appId: com.pguillen.readingtracker
---
- launchApp:
    clearState: true
- tapOn:
    id: "library_add_book_fab"
- tapOn:
    id: "add_edit_book_title_field"
- inputText: "Harry Potter"
- tapOn:
    id: "add_edit_book_author_field"
- inputText: "J.K.Rowling"
- tapOn:
    id: "add_edit_book_total_pages_field"
- inputText: "300"
- hideKeyboard
- tapOn:
    id: "add_edit_book_save_button"
- assertVisible:
    id: "library_book_card"
    index: 0
    containsDescendants:
      - text: "Harry Potter"
      - text: 'J\.K\.Rowling'
      - text: ".*300.*"
- tapOn:
    id: "library_book_card"
    index: 0
- tapOn:
    id: "book_detail_add_session_button"
- tapOn:
    id: "add_edit_session_end_page_field"
- inputText: "20"
- hideKeyboard
- tapOn:
    id: "add_edit_session_save_button"
- assertVisible:
    id: "book_detail_session_row"
- tapOn: 
    text: "See all"
    index: 0
- tapOn:
    id: "book_sessions_session_card"
- tapOn:
    id: "add_edit_session_date_field"
- tapOn: "Switch to text input mode"
- eraseText
- inputText: "01012026"
- tapOn: "Aceptar"
- tapOn:
    id: "add_edit_session_start_page_field"
    point: 90%,50%
- eraseText
- inputText: "10"
- tapOn:
    id: "add_edit_session_end_page_field"
    point: 90%,50%
- eraseText
- inputText: "30"
- tapOn:
    id: "add_edit_session_minutes_field"
- inputText: "30"
- tapOn:
    id: "add_edit_session_note_field"
- inputText: "Edited session note"
- hideKeyboard
- tapOn:
    id: "add_edit_session_save_button"
- assertVisible:
    id: "book_sessions_session_card"
    containsDescendants: 
        - text: "1/1/2026"
        - text: "Pages 10 - 30"
        - text: "30 minutes"
        - text: "Edited session note"


